name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/day-zero-shell
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Validate authorized homebrew fixture
        run: |
          python -m json.tool app/src/main/assets/catalog/authorized-fixture.json > /dev/null
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          rom = Path("app/src/main/assets/downloads/galaxy-patrol.nes").read_bytes()
          assert rom[:4] == b"NES\x1a", "fixture is not an iNES ROM"
          assert len(rom) == 49168, "fixture size changed"
          assert sha256(rom).hexdigest() == "97c1757ffd6a5bc1a591809b2b0f8988741f61f6abd82889c148ecae8a2f471f"
          PY

      - name: Compile and run unit tests
        run: timeout 15m gradle --no-daemon testDebugUnitTest

      - name: Build debug APK and instrumentation test APK
        run: timeout 15m gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Record APK checksum
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gamebox-os-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload visual test APK
        uses: actions/upload-artifact@v7
        with:
          name: gamebox-ui-test-apk-${{ github.sha }}
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  visual-qa:
    name: UI screenshots (${{ matrix.profile }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: phone
            size: 1080x2400
            density: 420
          - profile: dex
            size: 1920x1080
            density: 160
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gamebox-*
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture production screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            adb shell settings put system accelerometer_rotation 0
            adb install -r app-debug.apk
            adb install -r app-debug-androidTest.apk
            adb shell am instrument -w -e class com.gamebox.os.ui.BlueprintScreenshotsTest com.gamebox.os.test/androidx.test.runner.AndroidJUnitRunner > instrumentation.txt
            adb pull /sdcard/Android/data/com.gamebox.os/files/ui-captures ui-captures
            adb logcat -d > logcat.txt
            cat instrumentation.txt
            grep -q 'OK (1 test)' instrumentation.txt
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gamebox-ui-${{ matrix.profile }}-${{ github.sha }}
          path: |
            ui-captures/
            instrumentation.txt
            logcat.txt
          if-no-files-found: warn
          retention-days: 14

  instrumentation:
    name: Android instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Run Compose, Room, and accessibility instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.gamebox.os.ui.BlueprintScreenshotsTest
