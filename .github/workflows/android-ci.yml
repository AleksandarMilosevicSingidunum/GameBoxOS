name: Android CI

on:
  push:
    branches:
      - main
      - feature/day-zero-shell
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37 build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Validate catalog fixture
        run: python -m json.tool app/src/main/assets/catalog/authorized-fixture.json > /dev/null

      - name: Compile and run unit tests
        run: gradle --no-daemon testDebugUnitTest
