name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/day-zero-shell
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Validate authorized homebrew fixture
        run: |
          python -m json.tool app/src/main/assets/catalog/authorized-fixture.json > /dev/null
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          rom = Path("app/src/main/assets/downloads/galaxy-patrol.nes").read_bytes()
          assert rom[:4] == b"NES\x1a", "fixture is not an iNES ROM"
          assert len(rom) == 49168, "fixture size changed"
          assert sha256(rom).hexdigest() == "97c1757ffd6a5bc1a591809b2b0f8988741f61f6abd82889c148ecae8a2f471f"
          PY

      - name: Compile and run unit tests
        run: timeout 15m gradle --no-daemon testDebugUnitTest

      - name: Build debug APK and instrumentation test APK
        run: timeout 15m gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run instrumentation tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: timeout 15m gradle --no-daemon connectedDebugAndroidTest

      - name: Record APK checksum
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gamebox-os-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
