name: Publish release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        default: v0.1.0-alpha.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout tagged sources
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Test and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare release assets
        shell: bash
        run: |
          asset_name="GameBoxOS-$RELEASE_TAG-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset_name"
          sha256sum "$asset_name" > "$asset_name.sha256"

      - name: Attach APK to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "GameBoxOS-$RELEASE_TAG-debug.apk" \
            "GameBoxOS-$RELEASE_TAG-debug.apk.sha256" \
            --clobber
