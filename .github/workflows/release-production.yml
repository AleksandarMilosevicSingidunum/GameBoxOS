name: Publish signed production APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing production release tag
        required: true
        default: v1.0.0
      rollback_tag:
        description: Previous known-good release tag
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ROLLBACK_TAG: ${{ inputs.rollback_tag }}
      GAMEBOX_KEYSTORE_PASSWORD: ${{ secrets.GAMEBOX_KEYSTORE_PASSWORD }}
      GAMEBOX_KEY_ALIAS: ${{ secrets.GAMEBOX_KEY_ALIAS }}
      GAMEBOX_KEY_PASSWORD: ${{ secrets.GAMEBOX_KEY_PASSWORD }}
    steps:
      - name: Validate protected signing inputs
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production tag must be a stable semantic version: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$ROLLBACK_TAG" == "$RELEASE_TAG" || ! "$ROLLBACK_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "A distinct valid rollback tag is required." >&2
            exit 1
          fi
          for name in GAMEBOX_KEYSTORE_PASSWORD GAMEBOX_KEY_ALIAS GAMEBOX_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing protected secret: $name" >&2
              exit 1
            fi
          done

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Decode protected keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMEBOX_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "Missing GAMEBOX_KEYSTORE_BASE64" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gamebox-release.keystore"
          echo "GAMEBOX_KEYSTORE_PATH=$RUNNER_TEMP/gamebox-release.keystore" >> "$GITHUB_ENV"

      - name: Test and build signed release
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Verify signed APK and checksum
        shell: bash
        run: |
          asset="GameBoxOS-$RELEASE_TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          jarsigner -verify -strict "$asset"
          sha256sum "$asset" > "$asset.sha256"
          test -s "$asset.sha256"

      - name: Upload signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG"             "GameBoxOS-$RELEASE_TAG.apk"             "GameBoxOS-$RELEASE_TAG.apk.sha256"             --clobber
