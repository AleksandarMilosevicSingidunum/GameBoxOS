name: Windows Companion CI

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Run Windows core tests
        run: dotnet run --project windows/GameBox.Windows.Core.Tests/GameBox.Windows.Core.Tests.csproj --configuration Release
      - name: Publish self-contained Windows companion
        run: dotnet publish windows/GameBox.Windows/GameBox.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None --output artifacts/GameBoxWindows
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/GameBoxWindows/* -DestinationPath artifacts/GameBoxWindows-win-x64.zip
          (Get-FileHash artifacts/GameBoxWindows-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content artifacts/GameBoxWindows-win-x64.zip.sha256
      - name: Upload Windows companion
        uses: actions/upload-artifact@v7
        with:
          name: gamebox-windows-${{ github.sha }}
          path: |
            artifacts/GameBoxWindows-win-x64.zip
            artifacts/GameBoxWindows-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
